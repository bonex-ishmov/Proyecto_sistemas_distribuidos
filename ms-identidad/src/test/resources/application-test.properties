# Perfil "test": BD en memoria H2, solo para que los @SpringBootTest
# (MsIdentidadApplicationTests) levanten el contexto sin MySQL.
# Se superpone a application.properties; el resto de propiedades
# (JWT, usuario inicial) se heredan de alli.

spring.datasource.url=jdbc:h2:mem:db_identidad;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
