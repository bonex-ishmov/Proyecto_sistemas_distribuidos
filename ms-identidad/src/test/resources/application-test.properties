# Perfil "test": BD en memoria H2, solo para que los @SpringBootTest
# (MsIdentidadApplicationTests) levanten el contexto sin MySQL ni variables
# de entorno. Se superpone a application.properties.

spring.datasource.url=jdbc:h2:mem:db_identidad;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secreto dummy para que el contexto arranque en tests (la app real usa ${JWT_SECRET}).
app.jwt.secret=ClaveJwtSoloParaTestsNoUsarEnProduccion01234567890123456789

# Credenciales ficticias del usuario de sistema, solo para que
# UsuarioSistemaInitializer resuelva sus @Value al levantar el contexto en tests.
app.usuario-sistema.usuario=usuario-sistema-test
app.usuario-sistema.password=clave-de-prueba
