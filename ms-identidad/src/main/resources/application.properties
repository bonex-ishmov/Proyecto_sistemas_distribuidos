spring.application.name=ms-identidad
server.port=8081

# ---------- Configuración local (NO versionada) ----------
# spring.datasource.* y app.jwt.secret viven en
# src/main/resources/application-local.properties (copiar de
# application-local.properties.example y quitarle el sufijo .example).
# Sin ese archivo el servicio NO arranca. Los tests usan
# application-test.properties (H2) y no lo necesitan.
spring.config.import=optional:classpath:application-local.properties

# ---------- JPA / Hibernate ----------
# Base compartida: el esquema se administra con db/schema.sql, no lo toca la app.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
app.jwt.expiracion-ms=3600000

# ---------- Usuario inicial (Parte 1, módulo 1 del PDF) ----------
app.usuario-inicial.cedula=1
app.usuario-inicial.nombre=Administrador Inicial
app.usuario-inicial.email=admininicial@tiendagenerica.com
app.usuario-inicial.usuario=admininicial
app.usuario-inicial.password=admin123456

# ---------- Usuario de sistema (autenticación servicio-a-servicio) ----------
# Lo usan ms-ventas y ms-reportes para llamar a los endpoints /lote (un único
# usuario compartido: ms-reportes solo lee y reutiliza estas credenciales).
# UsuarioSistemaInitializer lo siembra por inserción DIRECTA (no por el alta
# normal), para NO disparar la regla A-4 que desactiva admininicial.
# El nombre de usuario y la contraseña son secretos: van en
# application-local.properties (app.usuario-sistema.usuario / .password) y DEBEN
# coincidir con ms.identidad.usuario-sistema / ms.identidad.password-sistema del
# application-local.properties de ms-ventas y de ms-reportes.
app.usuario-sistema.cedula=2
app.usuario-sistema.nombre=Usuario de Sistema
app.usuario-sistema.email=usuario-sistema@tiendagenerica.com

# ---------- CORS (frontend Angular) ----------
# No es secreto: la URL del frontend. En despliegue se sobreescribe con la
# variable de entorno CORS_ALLOWED_ORIGINS (uno o más orígenes separados por
# coma). Copia verbatim en los 5 módulos (ver docs/diagnostico.md).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}