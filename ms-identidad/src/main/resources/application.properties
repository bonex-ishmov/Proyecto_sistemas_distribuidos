spring.application.name=ms-identidad
server.port=8081

# ---------- Base de datos ----------
spring.datasource.url=jdbc:mysql://localhost:3306/db_identidad?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# HS256 exige clave de al menos 256 bits (32 caracteres). Esta tiene 64.
app.jwt.secret=TiendaGenericaClaveSecretaParaFirmarTokensJWT2026SuperSegura
app.jwt.expiracion-ms=3600000

# ---------- Usuario inicial (Parte 1, módulo 1 del PDF) ----------
app.usuario-inicial.cedula=1
app.usuario-inicial.nombre=Administrador Inicial
app.usuario-inicial.email=admininicial@tiendagenerica.com
app.usuario-inicial.usuario=admininicial
app.usuario-inicial.password=admin123456