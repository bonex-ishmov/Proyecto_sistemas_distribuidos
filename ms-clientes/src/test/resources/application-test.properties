# Perfil "test": BD en memoria H2, solo para que los @SpringBootTest
# (MsClientesApplicationTests) levanten el contexto sin MySQL.
# Se superpone a application.properties.

spring.datasource.url=jdbc:h2:mem:db_clientes;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
