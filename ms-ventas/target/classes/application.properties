spring.application.name=ms-ventas
server.port=8084

# ---------- Configuración local (NO versionada) ----------
# spring.datasource.* y app.jwt.secret viven en
# src/main/resources/application-local.properties (copiar de
# application-local.properties.example y quitarle el sufijo .example).
# Sin ese archivo el servicio NO arranca. Los tests usan
# application-test.properties (H2) y no lo necesitan.
# app.jwt.secret DEBE ser byte-idéntico al de los otros tres módulos.
spring.config.import=optional:classpath:application-local.properties

# ---------- JPA / Hibernate ----------
# Base compartida: el esquema se administra con db/schema.sql, no lo toca la app.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Servicios que consume ms-ventas (Incremento 4) ----------
# Solo URLs, NO son secretas. En local corren en localhost; en despliegue se
# sobreescriben por variable de entorno. El usuario y la clave del usuario de
# sistema (ms.identidad.usuario-sistema / password-sistema) SI son secretos y
# van en application-local.properties.
ms.identidad.base-url=${MS_IDENTIDAD_URL:http://localhost:8081}
ms.clientes.base-url=${MS_CLIENTES_URL:http://localhost:8082}
ms.catalogo.base-url=${MS_CATALOGO_URL:http://localhost:8083}