# Perfil "test": BD en memoria H2, solo para que MsVentasApplicationTests
# levante el contexto sin MySQL ni variables de entorno.
# Se superpone a application.properties.

spring.datasource.url=jdbc:h2:mem:db_ventas;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secreto dummy para que el contexto arranque en tests.
app.jwt.secret=ClaveJwtSoloParaTestsNoUsarEnProduccion01234567890123456789

# Incremento 4: dependencias HTTP. URLs y credenciales ficticias; en el test
# end-to-end el trafico saliente lo intercepta MockRestServiceServer y nunca
# sale de la JVM.
ms.identidad.base-url=http://ms-identidad.test
ms.clientes.base-url=http://ms-clientes.test
ms.catalogo.base-url=http://ms-catalogo.test
ms.identidad.usuario-sistema=ventas-sistema
ms.identidad.password-sistema=clave-de-prueba

# El test end-to-end define su propio bean serviciosRestClient (atado al
# MockRestServiceServer) que reemplaza al de HttpClientConfig.
spring.main.allow-bean-definition-overriding=true