spring.application.name=ms-reportes
server.port=8085

# ---------- Configuración local (NO versionada) ----------
# app.jwt.secret y las credenciales del usuario de sistema
# (ms.identidad.usuario-sistema / password-sistema) viven en
# src/main/resources/application-local.properties (copiar de
# application-local.properties.example y quitarle el sufijo .example).
# Sin ese archivo el servicio NO arranca. Los tests usan
# application-test.properties y no lo necesitan.
# app.jwt.secret DEBE ser byte-idéntico al de los otros cuatro módulos.
spring.config.import=optional:classpath:application-local.properties

# ---------- Persistencia ----------
# ms-reportes NO tiene base de datos: es un agregador de solo lectura.
# No hay spring.datasource.* ni spring.jpa.* a propósito.

# ---------- Servicios que consume ms-reportes ----------
# Solo URLs, NO son secretas. En local corren en localhost; en despliegue se
# sobreescriben por variable de entorno. El usuario y la clave del usuario de
# sistema (ms.identidad.usuario-sistema / password-sistema) SÍ son secretos y
# van en application-local.properties; son los MISMOS que usa ms-ventas
# (usuario compartido 'ventas-sistema', cédula 2).
ms.identidad.base-url=${MS_IDENTIDAD_URL:http://localhost:8081}
ms.clientes.base-url=${MS_CLIENTES_URL:http://localhost:8082}
ms.ventas.base-url=${MS_VENTAS_URL:http://localhost:8084}

# ---------- CORS (frontend Angular) ----------
# No es secreto: la URL del frontend. En despliegue se sobreescribe con la
# variable de entorno CORS_ALLOWED_ORIGINS (uno o más orígenes separados por
# coma). Copia verbatim en los 5 módulos (ver docs/diagnostico.md).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------- Reportes ----------
# Cédula del usuario de sistema (compartido con ms-ventas) que se OCULTA del
# listado de usuarios del módulo 7. admininicial (cédula 1) sí aparece.
app.reportes.cedula-usuario-sistema=2
