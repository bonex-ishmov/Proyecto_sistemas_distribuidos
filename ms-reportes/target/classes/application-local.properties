# Plantilla. Copiá este archivo a  application-local.properties  (mismo directorio,
# sin el sufijo .example) y completá los valores.
# application-local.properties está en el .gitignore de la raíz: nunca se versiona.
# application.properties lo importa con spring.config.import, así que se lee solo
# (no hace falta activar ningún perfil). Sin este archivo el servicio NO arranca.
#
# ms-reportes NO tiene base de datos: acá NO va spring.datasource.*
#
# ==========================================================================
#  app.jwt.secret DEBE SER BYTE-IDÉNTICO al de ms-identidad, ms-clientes,
#  ms-catalogo y ms-ventas. Si difiere aunque sea en UN carácter, un espacio
#  al final o un salto de línea, este servicio devolverá 401 a TODA petición
#  que traiga un token válido emitido por ms-identidad, y el error NO dice
#  "secreto distinto", dice sólo "token inválido". Copialo tal cual de otro
#  módulo, no lo retecleés.
# ==========================================================================

app.jwt.secret=TiendaGenerica2026ClaveJwtCompartidaEntreLosTresMicroservicios

# ---------- Usuario de sistema (autenticación servicio-a-servicio) ----------
# ms-reportes usa EL MISMO usuario de sistema que ms-ventas ('ventas-sistema',
# cédula 2): solo hace lecturas y reutiliza esas credenciales. No hay un usuario
# propio de reportes.
# Estos dos valores DEBEN ser idénticos, carácter por carácter, a
# ms.identidad.usuario-sistema / ms.identidad.password-sistema del
# application-local.properties de ms-ventas (y a app.usuario-sistema.usuario /
# .password del application-local.properties de ms-identidad).
# El login es perezoso: si están mal, ms-reportes arranca igual y solo falla
# (503) al pedir un reporte.
ms.identidad.usuario-sistema=ventas-sistema
ms.identidad.password-sistema=usersistema12345
