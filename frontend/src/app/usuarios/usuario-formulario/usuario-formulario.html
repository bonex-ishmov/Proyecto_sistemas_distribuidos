<div class="page-header">
  <div>
    <h2>{{ modoEdicion() ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
    <p class="page-description">
      Datos de acceso del usuario. La contraseña es obligatoria solo al crear.
    </p>
  </div>
</div>

<form class="form" [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="form-field">
    <label for="cedulaUsuario">Cédula</label>
    <input id="cedulaUsuario" type="number" formControlName="cedulaUsuario" />
  </div>

  <div class="form-field">
    <label for="nombreUsuario">Nombre completo</label>
    <input id="nombreUsuario" type="text" formControlName="nombreUsuario" />
  </div>

  <div class="form-field">
    <label for="emailUsuario">Correo electrónico</label>
    <input id="emailUsuario" type="email" formControlName="emailUsuario" />
  </div>

  <div class="form-field">
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" formControlName="usuario" />
  </div>

  <div class="form-field">
    <label for="password">
      Contraseña
      @if (modoEdicion()) {
        <span class="form-help">(dejar vacío para no cambiarla)</span>
      }
    </label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn--primary" [disabled]="formulario.invalid || enviando()">
      {{ enviando() ? 'Guardando...' : 'Guardar' }}
    </button>
    <a routerLink="/usuarios">Cancelar</a>
  </div>
</form>
