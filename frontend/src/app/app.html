<div class="app-shell">
  @if (sesion.nombreUsuario(); as nombre) {
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-brand-mark">TG</span>
        <span class="sidebar-brand-text">Tienda Genérica</span>
      </div>

      <nav class="sidebar-nav">
        <a
          routerLink="/"
          routerLinkActive="sidebar-link--activo"
          [routerLinkActiveOptions]="{ exact: true }"
          class="sidebar-link"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-8 9 8" />
            <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
          </svg>
          Inicio
        </a>
        <a routerLink="/usuarios" routerLinkActive="sidebar-link--activo" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.2" />
            <path d="M3.5 19c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5" />
            <circle cx="17" cy="8.5" r="2.5" />
            <path d="M15.5 13.2c2.4.3 4 2.3 4 5.3" />
          </svg>
          Usuarios
        </a>
        <a routerLink="/clientes" routerLinkActive="sidebar-link--activo" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M6 16c0-1.7 1.3-3 3-3s3 1.3 3 3" />
            <path d="M14 9h4M14 13h4" />
          </svg>
          Clientes
        </a>
        <a routerLink="/proveedores" routerLinkActive="sidebar-link--activo" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="13" height="9" rx="1" />
            <path d="M15 10h3l3 3v3h-6z" />
            <circle cx="6.5" cy="18" r="1.6" />
            <circle cx="17" cy="18" r="1.6" />
          </svg>
          Proveedores
        </a>
        <a routerLink="/productos" routerLinkActive="sidebar-link--activo" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8l9-4.5L21 8v8l-9 4.5L3 16z" />
            <path d="M3 8l9 4.5L21 8" />
            <path d="M12 12.5V21" />
          </svg>
          Productos
        </a>
        <a routerLink="/ventas" routerLinkActive="sidebar-link--activo" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="17" cy="20" r="1.4" />
            <path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6" />
          </svg>
          Ventas
        </a>
        <a routerLink="/reportes" routerLinkActive="sidebar-link--activo" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
            <path d="M9 8h6M9 12h6M9 16h4" />
          </svg>
          Reportes
        </a>
      </nav>

      <div class="sidebar-user">
        <app-avatar [nombre]="nombre" />
        <span class="sidebar-user-nombre">{{ nombre }}</span>
        <button type="button" class="sidebar-logout" (click)="cerrarSesion()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </div>
    </aside>
  }

  <div class="app-body">
    @if (notificacion.mensaje(); as mensaje) {
      <div class="app-error" role="alert">
        <span>{{ mensaje }}</span>
        <button type="button" (click)="notificacion.limpiar()">Cerrar</button>
      </div>
    }

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
