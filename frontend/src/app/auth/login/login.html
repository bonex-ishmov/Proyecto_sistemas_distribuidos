<div class="login-page">
  <div class="login-brand">
    <span class="sidebar-brand-mark">TG</span>
    <span>Tienda Genérica</span>
  </div>

  <form class="form login-form" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
    <h2>Iniciar sesión</h2>
    <p class="page-description">Ingresá con tu usuario y contraseña.</p>

    <div class="form-field">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" formControlName="usuario" autocomplete="username" />
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    <button type="submit" class="btn btn--primary" [disabled]="formulario.invalid || enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
