<div class="login">
  <!-- Formas difuminadas flotantes: solo ambiente, sin contenido -->
  <span class="login__blob login__blob--1" aria-hidden="true"></span>
  <span class="login__blob login__blob--2" aria-hidden="true"></span>

  <div class="login__panel">
    <!-- Izquierda: tarjeta blanca con el formulario -->
    <div class="login__card">
      <div class="login__brand">
        <span class="login__brand-mark">TG</span>
        <span class="login__brand-name">Tienda Genérica</span>
      </div>

      <h1 class="login__title">Iniciar sesión</h1>
      <p class="login__subtitle">Ingresá con tu usuario y contraseña.</p>

      <form class="login__form" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
        <div class="login__field">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            autocomplete="username"
            placeholder="admininicial"
          />
        </div>

        <div class="login__field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="login__submit" [disabled]="formulario.invalid || enviando()">
          {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </div>

    <!-- Derecha: composición decorativa -->
    <aside class="login__aside" aria-hidden="true">
      <span class="login__float login__float--1"></span>
      <span class="login__float login__float--2"></span>

      <svg class="login__bag" viewBox="0 0 200 200" role="presentation">
        <defs>
          <linearGradient id="loginBagGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#38bdf8" />
            <stop offset="0.55" stop-color="#0284c7" />
            <stop offset="1" stop-color="#1d4ed8" />
          </linearGradient>
        </defs>
        <rect x="38" y="62" width="124" height="108" rx="20" fill="url(#loginBagGrad)" />
        <path
          d="M74 74V58a26 26 0 0 1 52 0v16"
          fill="none"
          stroke="#e0f2fe"
          stroke-width="10"
          stroke-linecap="round"
        />
        <circle cx="79" cy="96" r="6" fill="#e0f2fe" />
        <circle cx="121" cy="96" r="6" fill="#e0f2fe" />
      </svg>

      <div class="login__aside-text">
        <h2>Tienda Genérica</h2>
        <p>Gestión de clientes, proveedores, productos y ventas en un solo lugar.</p>
      </div>
    </aside>
  </div>
</div>
