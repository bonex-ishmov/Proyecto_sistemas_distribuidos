spring.application.name=ms-catalogo
server.port=8083

# ---------- Base de datos ----------
spring.datasource.url=jdbc:mysql://localhost:3306/db_catalogo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD_DE_MYSQL

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# DEBE SER EXACTAMENTE LA MISMA CLAVE QUE EN ms-identidad
app.jwt.secret=TiendaGenericaClaveSecretaParaFirmarTokensJWT2026SuperSegura

# ---------- Carga de archivos ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
