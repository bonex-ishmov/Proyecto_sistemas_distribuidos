# Perfil "test": BD en memoria H2, solo para que los @SpringBootTest
# (MsCatalogoApplicationTests) levanten el contexto sin MySQL.
# Se superpone a application.properties: aqui va la contrasena real
# de MySQL, pero en test se ignora porque apuntamos a H2.

spring.datasource.url=jdbc:h2:mem:db_catalogo;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
