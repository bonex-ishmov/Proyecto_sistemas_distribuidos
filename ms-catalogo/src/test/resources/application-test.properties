# Perfil "test": BD en memoria H2, solo para que los @SpringBootTest
# (MsCatalogoApplicationTests) levanten el contexto sin MySQL ni variables
# de entorno. Se superpone a application.properties.

spring.datasource.url=jdbc:h2:mem:db_catalogo;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secreto dummy para que el contexto arranque en tests (la app real usa ${JWT_SECRET}).
app.jwt.secret=ClaveJwtSoloParaTestsNoUsarEnProduccion01234567890123456789
